<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoJo's Bizarre Adventure · Partes</title>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            color: #f0f0f0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== MENU DE ABAS (TABS) ===== */
        .tab-menu {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--border-glow, rgba(255, 215, 0, 0.3));
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }

        .tab-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ddd;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-transform: uppercase;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #111;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--border-glow);
            transform: scale(1.05);
        }

        /* ===== CONTEÚDO PRINCIPAL ===== */
        .container {
            flex: 1;
            max-width: 1300px;
            margin: 2rem auto;
            padding: 2rem;
            width: 95%;
            transition: all 0.4s ease;
            background: var(--card-bg, rgba(0, 0, 0, 0.5));
            backdrop-filter: blur(8px);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 0 1px var(--border-glow);
            border-top: 4px solid var(--accent);
        }

        .part-content {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .part-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .part-title {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            color: var(--accent);
            text-transform: uppercase;
        }

        .part-sub {
            font-size: 1.2rem;
            opacity: 0.9;
            font-style: italic;
            display: inline-block;
            border-bottom: 2px dashed var(--accent);
            padding-bottom: 0.5rem;
        }

        /* ===== LAYOUT GRID (HERÓI - TEXTO - VILÃO) ===== */
        .layout-grid {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 2rem;
            align-items: center;
        }

        .char-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            position: relative;
        }

        .char-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 16px;
            border: 3px solid var(--accent);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            filter: grayscale(20%) contrast(110%);
        }

        .char-img:hover {
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 20px 40px var(--border-glow);
            filter: grayscale(0%) contrast(120%);
            z-index: 2;
        }

        .char-name {
            background: var(--accent);
            color: #111;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            font-family: 'Impact', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transform: translateY(-25px); /* Sobrepõe a imagem */
            z-index: 3;
        }

        .part-text {
            font-size: 1.15rem;
            line-height: 1.8;
            padding: 0 1rem;
        }

        .part-text p {
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 1.5rem;
            border-radius: 16px;
            border-left: 4px solid var(--accent);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .part-text p:last-child {
            margin-bottom: 0;
        }

        /* ===== TEMAS (variáveis CSS por parte) ===== */
        body {
            --bg-start: #1a1a1a;
            --bg-end: #2a2a2a;
            --text-color: #eee;
            --accent: #ffd700;
            --card-bg: rgba(0,0,0,0.6);
            --border-glow: rgba(255, 215, 0, 0.3);
        }

        body.theme-p1 { --bg-start: #1e0a0a; --accent: #c99b3b; --border-glow: rgba(201, 155, 59, 0.4); background: radial-gradient(circle at 50% 50%, #3a1515, #1a0707); }
        body.theme-p2 { --bg-start: #281a3a; --accent: #b3ff00; --border-glow: rgba(179, 255, 0, 0.3); background: radial-gradient(circle at 50% 50%, #4a2a6a, #1e1030); }
        body.theme-p3 { --bg-start: #3a2810; --accent: #f0a030; --border-glow: rgba(240, 160, 48, 0.4); background: radial-gradient(circle at 50% 50%, #6a4a20, #1c1830); }
        body.theme-p4 { --bg-start: #ffe066; --text-color: #1f1a2a; --accent: #ff4d94; --card-bg: rgba(255, 255, 240, 0.85); --border-glow: rgba(255, 77, 148, 0.4); background: radial-gradient(circle at 50% 50%, #ffdd99, #cc88ff); }
        body.theme-p4 .part-text p { background: rgba(255, 255, 255, 0.6); color: #111; }
        body.theme-p5 { --bg-start: #1a0a0a; --accent: #d4af37; --border-glow: rgba(212, 175, 55, 0.4); background: radial-gradient(circle at 50% 50%, #5a1a2a, #1a0a0a); }
        body.theme-p6 { --bg-start: #1a2a1a; --accent: #00e6b0; --border-glow: rgba(0, 230, 176, 0.4); background: radial-gradient(circle at 50% 50%, #2a5a3a, #0a1a2a); }
        body.theme-p7 { --bg-start: #3a2a1a; --accent: #b8966a; --border-glow: rgba(184, 150, 106, 0.4); background: radial-gradient(circle at 50% 50%, #5a4020, #1a1008); }
        body.theme-p8 { --bg-start: #0a2a3a; --accent: #5aa0c0; --border-glow: rgba(90, 160, 192, 0.4); background: radial-gradient(circle at 50% 50%, #1a4a6a, #0a1a2a); }
        body.theme-p9 { --bg-start: #1a3a1a; --accent: #2ecc71; --border-glow: rgba(46, 204, 113, 0.4); background: radial-gradient(circle at 50% 50%, #2a6a2a, #0a2a1a); }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 1024px) {
            .layout-grid {
                grid-template-columns: 220px 1fr 220px;
                gap: 1.5rem;
            }
            .char-img { height: 320px; }
            .part-title { font-size: 2.4rem; }
        }

        @media (max-width: 768px) {
            /* No celular, empilha: Título -> Herói e Vilão lado a lado -> Texto */
            .layout-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-areas: 
                    "heroi vilao"
                    "texto texto";
                gap: 1rem;
            }
            .hero-box { grid-area: heroi; }
            .villain-box { grid-area: vilao; }
            .part-text { grid-area: texto; margin-top: 1rem; }
            
            .char-img { height: 280px; }
            .part-title { font-size: 2rem; }
            .container { padding: 1.5rem; margin: 1rem; }
            .tab-btn { font-size: 0.8rem; padding: 0.4rem 0.8rem; }
        }

        @media (max-width: 480px) {
            /* Em telas muito pequenas, empilha tudo verticalmente */
            .layout-grid {
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "heroi"
                    "texto"
                    "vilao";
            }
            .char-img { height: 350px; }
            .char-name { font-size: 1rem; }
        }
    </style>
</head>
<body class="theme-p1">
    <!-- MENU DE ABAS -->
    <nav class="tab-menu" id="tabMenu">
        <button class="tab-btn active" data-part="1">Parte 1</button>
        <button class="tab-btn" data-part="2">Parte 2</button>
        <button class="tab-btn" data-part="3">Parte 3</button>
        <button class="tab-btn" data-part="4">Parte 4</button>
        <button class="tab-btn" data-part="5">Parte 5</button>
        <button class="tab-btn" data-part="6">Parte 6</button>
        <button class="tab-btn" data-part="7">Parte 7</button>
        <button class="tab-btn" data-part="8">Parte 8</button>
        <button class="tab-btn" data-part="9">Parte 9</button>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container" id="mainContainer">
        <div id="partDisplay" class="part-content">
            <!-- Injetado via JS -->
        </div>
    </main>

    <script>
        (function() {
            // ===== DADOS DAS PARTES =====
            // Substitua as URLs do 'placehold.co' pelos links reais das imagens de sua preferência (Imgur, Wiki, etc).
            const partesData = {
                1: {
                    titulo: "Phantom Blood",
                    subtitulo: "A origem da máscara de pedra e o sangue de um cavalheiro.",
                    nomeHeroi: "Jonathan",
                    imgHeroi: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvfjrzjUWbkJEEKDupter6cdUT9SAAwK64byYU7SjHyTWHqnLe5yzcyFU&s=10",
                    nomeVilao: "Dio Brando",
                    imgVilao: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWuUqGtqGMbp93lNzu2jVUlTETD12f7wwQ0p6z7SLXUQ&s=10",
                    texto: `<p>No século XIX, a rivalidade entre Jonathan Joestar e seu irmão adotivo, Dio Brando, desencadeia uma guerra sobrenatural. Quando Dio descobre a Máscara de Pedra, que o transforma em um vampiro imortal, Jonathan deve dominar a energia Hamon (Ondas) para detê-lo.</p>
                            <p><em>Conceito central:</em> Hamon, a energia da respiração, utilizada para combater vampiros e criaturas das trevas.</p>`
                },
                2: {
                    titulo: "Battle Tendency",
                    subtitulo: "Aventura nos anos 30 e o despertar dos Deuses Astecas.",
                    nomeHeroi: "Joseph",
                    imgHeroi: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSzjJyMqyUnJ3bE4aW6pViYk2EXSY6tJ-Lrif2ccjMjQ&s=10",
                    nomeVilao: "Kars",
                    imgVilao: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRv5-2WghrjCKmGzxMCS_KQYG_J-jl9lDgHWA4ek5OAkg&s=10",
                    texto: `<p>Joseph Joestar, neto de Jonathan, enfrenta uma ameaça maior que os vampiros: os Homens do Pilar, seres imortais criados pela Máscara de Pedra. Com astúcia e seu Hamon improvisado, Joseph viaja pela Europa e América do Sul para deter Kars, que busca se tornar o ser supremo.</p>`
                },
                3: {
                    titulo: "Stardust Crusaders",
                    subtitulo: "Uma jornada ao Egito sob o signo do Tarô.",
                    nomeHeroi: "Jotaro",
                    imgHeroi: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTaNNux1Sj-cz2-L36HZWjBqeyzYGQJ_hnAS8s9v5KnyA&s=10",
                    nomeVilao: "DIO",
                    imgVilao: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzop61zNJbC16mxMhzZxkKQCNT2uxD4L7g5OnRhzFZKP2qH5Eb4SBlvTU&s=10",
                    texto: `<p>Anos depois, a maldição de DIO retorna. Jotaro Kujo e seus aliados — todos portadores de Stands, manifestações físicas do espírito — partem do Japão ao Egito para derrotar DIO de uma vez por todas.</p>
                            <p><em>Conceito central:</em> Stands — poderes psíquicos materializados com habilidades únicas. A viagem é uma batalha contra o tempo e o destino.</p>`
                },
                4: {
                    titulo: "Diamond is Unbreakable",
                    subtitulo: "Mistério e cotidiano na cidade de Morioh, anos 90.",
                    nomeHeroi: "Josuke",
                    imgHeroi: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjfazOXo4CSmKsqAuAV4kCU6rk0S7vI8-qNC0dfQeaVw&s=10",
                    nomeVilao: "Yoshikage Kira",
                    imgVilao: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzZrsI_KEoUUDAMUYJVMlzx4JvF7gslZb1WCVaJ36qVw&s=10",
                    texto: `<p>Em Morioh, uma cidade pacata, Stands surgem entre os habitantes. Josuke, filho ilegítimo de Joseph, une forças com outros usuários para proteger a cidade de um assassino em série que deseja apenas uma vida tranquila.</p>`
                },
                5: {
                    titulo: "Golden Wind",
                    subtitulo: "Máfia italiana e o sonho de um novo amanhecer.",
                    nomeHeroi: "Giorno",
                    imgHeroi: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFDEVdyWNzKcLKPRUSaeGkcdjnnjezL53X2ARNv3WYSg&s=10",
                    nomeVilao: "Diavolo",
                    imgVilao: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8FJwRIWhw-zSWIEKbvW54ivpklz0hzAbDk67KDHCanyb_JBPsZFBv8Kk&s=10",
                    texto: `<p>Giorno, filho de Dio, almeja se tornar um "Gang-Star" e reformar a máfia italiana por dentro. Ao lado de Bruno Bucciarati e sua equipe, ele enfrenta traições e batalhas implacáveis contra o misterioso chefe Diavolo.</p>`
                },
                6: {
                    titulo: "Stone Ocean",
                    subtitulo: "Prisão, punks e o fim do universo.",
                    nomeHeroi: "Jolyne",
                    imgHeroi: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuofnExf15_IDj5YtmtSkUK65vRZ7Mjebj5b0njWl1uw&s=10",
                    nomeVilao: "Enrico Pucci",
                    imgVilao: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSl9JZ-0D0sbd1xm4PQZi1J3yf1D-hDxPXMrT5j4XYhctoh7gvPXzZD6ew&s=10",
                    texto: `<p>Jolyne, filha de Jotaro, é presa injustamente e descobre que um sacerdote chamado Pucci está manipulando eventos para alcançar o "Céu". Dentro da prisão de segurança máxima, Jolyne luta para salvar seu pai e deter um plano que pode reiniciar o universo.</p>`
                },
                7: {
                    titulo: "Steel Ball Run",
                    subtitulo: "A corrida pelo oeste, entre steampunk e renascença.",
                    nomeHeroi: "Johnny",
                    imgHeroi: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNfjyS3GAbFsLeQL22ludTK52xnDzxKcvP5bxY_k93oQ&s=10",
                    nomeVilao: "Funny Valentine",
                    imgVilao: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRib9LGtJePBfpFdMA9YjO-EnfwI5mJCQNaUKWfRyp--g&s=10",
                    texto: `<p>Em uma versão alternativa do século XIX, uma corrida a cavalo de San Diego a Nova York reúne competidores do mundo todo. Johnny busca o poder do "Spin" para recuperar seus movimentos, enquanto o Presidente dos EUA busca relíquias sagradas.</p>`
                },
                8: {
                    titulo: "JoJolion",
                    subtitulo: "Mistério na cidade costeira de Morioh, após o tsunami.",
                    nomeHeroi: "Josuke (Gappy)",
                    imgHeroi: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXKZj6gOWX5CgEHUl7dy6FpXC6CiQtmAwogC3B0TPJUw&s=10",
                    nomeVilao: "Tooru",
                    imgVilao: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT59VfJYLoB3B1qwZjAANpKkj-KTJZfayblkNIvtfsTIg&s=10",
                    texto: `<p>Em uma Morioh reformada, um jovem com amnésia é encontrado e adotado pela família Higashikata. Ele busca sua identidade enquanto enfrenta uma maldição familiar e um Stand que invoca a calamidade para aqueles que o perseguem.</p>`
                },
                9: {
                    titulo: "The JOJOLands",
                    subtitulo: "Ilhas havaianas, dinheiro e o sonho de um novo mundo.",
                    nomeHeroi: "Jodio",
                    imgHeroi: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZzx1WW5R0SxlT9SXHBp7cIX-D2TemLkui3-Ys2_dOCA&s=10",
                    nomeVilao: "Desconhecido",
                    imgVilao: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS86Vx7OBjPMh_alDgHpoCTQ-HK3tbqnaoqWyR4SRyU8A&s=10",
                    texto: `<p>Ambientado no Havaí, Jodio Joestar e sua irmã Dragona se envolvem em um esquema de contrabando. Entre praias paradisíacas e negócios obscuros, eles descobrem que o dinheiro e o "ouro" escondem segredos que alteram a realidade.</p>`
                }
            };

            const tabButtons = document.querySelectorAll('.tab-btn');
            const displayDiv = document.getElementById('partDisplay');
            const body = document.body;

            function loadPart(partNumber) {
                const data = partesData[partNumber];
                if (!data) return;

                // Força o "reflow" para a animação rodar toda vez que trocar de aba
                displayDiv.classList.remove('part-content');
                void displayDiv.offsetWidth; 
                displayDiv.classList.add('part-content');

                // Renderiza o novo layout em GRID
                displayDiv.innerHTML = `
                    <div class="part-header">
                        <h1 class="part-title">${data.titulo}</h1>
                        <div class="part-sub">${data.subtitulo}</div>
                    </div>
                    
                    <div class="layout-grid">
                        <div class="char-box hero-box">
                            <img src="${data.imgHeroi}" alt="${data.nomeHeroi}" class="char-img">
                            <span class="char-name">${data.nomeHeroi}</span>
                        </div>
                        
                        <div class="part-text">
                            ${data.texto}
                        </div>
                        
                        <div class="char-box villain-box">
                            <img src="${data.imgVilao}" alt="${data.nomeVilao}" class="char-img">
                            <span class="char-name">${data.nomeVilao}</span>
                        </div>
                    </div>
                `;

                // Atualiza visual dos botões
                tabButtons.forEach(btn => btn.classList.remove('active'));
                document.querySelector(`.tab-btn[data-part="${partNumber}"]`).classList.add('active');

                // Muda o tema do site
                body.className = body.className.split(' ').filter(c => !c.startsWith('theme-p')).join(' ');
                body.classList.add(`theme-p${partNumber}`);
            }

            // Inicia eventos de clique
            tabButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    loadPart(parseInt(this.dataset.part, 10));
                });
            });

            // Teclas 1-9 para atalho no teclado
            document.addEventListener('keydown', (e) => {
                const num = parseInt(e.key, 10);
                if (num >= 1 && num <= 9) {
                    const btn = document.querySelector(`.tab-btn[data-part="${num}"]`);
                    if (btn) btn.click();
                }
            });

            // Carrega Parte 1 ao abrir
            loadPart(1);
        })();
    </script>
</body>
</html>
