<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RPG Canvas - Mecânicas e Boss</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            border: 3px solid #444;
            background-color: #1e1e1e;
        }
        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>RPG Canvas: Mobs, Biomas e Boss Final</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="instructions">
        Controles: <b>WASD</b> para mover | <b>Clique do Mouse</b> para atacar de longe (Classe Ranged)
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- 1. DEFINIÇÃO DE BIOMAS ---
const biomes = {
    forest: { x: 50, y: 50, width: 300, height: 500, color: 'rgba(34, 139, 34, 0.2)' },
    desert: { x: 450, y: 50, width: 300, height: 500, color: 'rgba(218, 165, 32, 0.2)' }
};

// --- 2. PLAYER (Spawn na Floresta + Ranged) ---
const player = {
    x: biomes.forest.x + 100, // Spawn dentro da Floresta
    y: biomes.forest.y + 100,
    radius: 12,
    speed: 3,
    color: '#00ffff',
    attackRange: 250, // Alcance da classe Ranged
    keys: {}
};

// --- 3. MOBS COM RESTRIÇÃO DE BIOMA (LEASH) ---
class Mob {
    constructor(x, y, maxLeashDistance, color) {
        this.x = x;
        this.y = y;
        this.originX = x;
        this.originY = y;
        this.maxLeashDistance = maxLeashDistance; // Limite do Bioma
        this.radius = 10;
        this.speed = 1.8;
        this.color = color;
        this.isReturning = false;
    }

    update() {
        const distFromOrigin = Math.hypot(this.x - this.originX, this.y - this.originY);
        const distToPlayer = Math.hypot(this.x - player.x, this.y - player.y);

        // Se passou do limite do bioma, força o retorno
        if (distFromOrigin > this.maxLeashDistance) {
            this.isReturning = true;
        }
        if (this.isReturning && distFromOrigin < 10) {
            this.isReturning = false;
        }

        // Movimentação
        if (this.isReturning) {
            this.moveTowards(this.originX, this.originY);
        } else if (distToPlayer < 150) { // Visão do Mob
            this.moveTowards(player.x, player.y);
        }
    }

    moveTowards(targetX, targetY) {
        const angle = Math.atan2(targetY - this.y, targetX - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;
    }

    draw() {
        // Desenha raio de leash em cinza fraco
        ctx.beginPath();
        ctx.arc(this.originX, this.originY, this.maxLeashDistance, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

const mobs = [
    new Mob(150, 200, 120, '#ff4444'), // Mob Floresta
    new Mob(600, 300, 120, '#ffaa00')  // Mob Deserto
];

// --- 4. PROJÉTEIS (Player e Boss) ---
const projectiles = [];

class Projectile {
    constructor(x, y, targetX, targetY, speed, color, isHostile = false) {
        this.x = x;
        this.y = y;
        this.radius = 5;
        this.color = color;
        this.isHostile = isHostile;
        
        const angle = Math.atan2(targetY - y, targetX - x);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.lifeTime = 120; // Frames de vida
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.lifeTime--;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

// --- 5. BOSS FINAL COM ATAQUES ---
const boss = {
    x: 600,
    y: 150,
    radius: 25,
    color: '#a020f0',
    attackTimer: 0,
    aoeWarning: false,
    aoeRadius: 0,

    update() {
        this.attackTimer++;

        // A cada ~2.5 segundos escolhe um ataque aleatório
        if (this.attackTimer > 150) {
            this.attackTimer = 0;
            const attackType = Math.floor(Math.random() * 3);

            switch (attackType) {
                case 0:
                    this.executeDash();
                    break;
                case 1:
                    this.executeSpreadShot();
                    break;
                case 2:
                    this.executeAoE();
                    break;
            }
        }

        // Expansão da animação do AoE
        if (this.aoeWarning) {
            this.aoeRadius += 2;
            if (this.aoeRadius > 100) {
                this.aoeWarning = false;
                this.aoeRadius = 0;
            }
        }
    },

    executeDash() {
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        this.x += Math.cos(angle) * 80; // Avanço rápido
        this.y += Math.sin(angle) * 80;
    },

    executeSpreadShot() {
        // Dispara 3 projéteis em leque
        const baseAngle = Math.atan2(player.y - this.y, player.x - this.x);
        const angles = [baseAngle - 0.3, baseAngle, baseAngle + 0.3];

        angles.forEach(angle => {
            const targetX = this.x + Math.cos(angle) * 100;
            const targetY = this.y + Math.sin(angle) * 100;
            projectiles.push(new Projectile(this.x, this.y, targetX, targetY, 5, '#e066ff', true));
        });
    },

    executeAoE() {
        this.aoeWarning = true;
        this.aoeRadius = 10;
    },

    draw() {
        // Animação de Alerta de AoE
        if (this.aoeWarning) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.aoeRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
};

// --- CONTROLES E INPUTS ---
window.addEventListener('keydown', e => player.keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => player.keys[e.key.toLowerCase()] = false);

// Ataque de Longa Distância (Ranged Click)
canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const dist = Math.hypot(mouseX - player.x, mouseY - player.y);

    // Só dispara se estiver dentro do raio de alcance Ranged
    if (dist <= player.attackRange) {
        projectiles.push(new Projectile(player.x, player.y, mouseX, mouseY, 7, '#00ffff', false));
    }
});

// --- GAME LOOP ---
function update() {
    // Movimentação do Player
    if (player.keys['w']) player.y -= player.speed;
    if (player.keys['s']) player.y += player.speed;
    if (player.keys['a']) player.x -= player.speed;
    if (player.keys['d']) player.x += player.speed;

    // Atualiza Mobs e Boss
    mobs.forEach(mob => mob.update());
    boss.update();

    // Atualiza Projéteis
    projectiles.forEach((p, index) => {
        p.update();
        if (p.lifeTime <= 0) projectiles.splice(index, 1);
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desenha Biomas
    for (let b in biomes) {
        const biome = biomes[b];
        ctx.fillStyle = biome.color;
        ctx.fillRect(biome.x, biome.y, biome.width, biome.height);
    }

    // Desenha Alcance do Player (Linha Fina)
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.attackRange, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
    ctx.stroke();

    // Desenha Entidades
    mobs.forEach(mob => mob.draw());
    boss.draw();
    projectiles.forEach(p => p.draw());

    // Desenha Player
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
